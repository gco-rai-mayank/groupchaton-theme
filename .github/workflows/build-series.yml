name: Chapter lists + publish
# Designed & Developed by Nivesh Sahayak (https://www.niveshsahayak.in/). All rights reserved: see LICENSE.

# Every 3 hours: read the chapter list from the blog's public feed into data/series/*.json, then publish
# to GitHub Pages. Also publishes whenever you edit a file on main.
# New chapters show up on the site straight away anyway: gco.js also checks Blogger's feed for the newest posts.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-series
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build chapter lists
        # if the blog feed is down, keep the last good lists and still publish
        continue-on-error: true
        run: python scripts/build_series.py
      - name: Commit if changed
        id: commit
        run: |
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update chapter lists"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
